<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EarlyEdge Field Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080808;--surface:#0f0f0f;--surface2:#141414;--border:#1e1e1e;--border2:#2a2a2a;--text:#e0e0e0;--muted:#555;--dim:#333;--green:#00C48C;--yellow:#F5C518;--orange:#FF7A00;--red:#FF3B3B;--font:'Courier New',monospace}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;max-width:480px;margin:0 auto}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:700;letter-spacing:.1em;color:#fff}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:.14em;margin-top:2px}
.live-badge{font-size:9px;color:var(--green);letter-spacing:.1em;border:1px solid rgba(0,196,140,.25);border-radius:4px;padding:4px 8px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:6px;padding:3px;margin-bottom:16px;border:1px solid var(--border)}
.tab{padding:9px;background:transparent;color:var(--muted);border:1px solid transparent;border-radius:4px;font-size:11px;letter-spacing:.08em;font-family:var(--font);cursor:pointer}
.tab.active{background:var(--surface2);color:#fff;border-color:var(--border2)}
main{padding:16px}
.field{margin-bottom:13px}
label{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;margin-bottom:6px;text-transform:uppercase}
label span{color:var(--dim);text-transform:none;margin-left:5px}
input,select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:6px;padding:12px;font-size:14px;font-family:var(--font);appearance:none;outline:none}
input.big{font-size:20px}
input.warn{border-color:var(--orange)}
input.crit{border-color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.axis-label{font-size:9px;color:var(--dim);margin-bottom:4px}
.axis-input{padding:10px 6px!important;text-align:center;font-size:13px!important}
.vector-rms{font-size:10px;color:var(--muted);margin-top:5px}
.advanced-toggle{width:100%;background:transparent;color:var(--dim);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:10px;font-family:var(--font);cursor:pointer;letter-spacing:.08em;margin-bottom:13px}
.advanced-section{display:none}
.advanced-section.open{display:block}
.photo-zone{border:1px dashed var(--border2);border-radius:8px;padding:28px 20px;text-align:center;margin-bottom:16px;background:var(--surface)}
.photo-icon{font-size:36px;margin-bottom:10px}
.photo-status{font-size:12px;color:var(--muted)}
.photo-status.ok{color:var(--green)}
.photo-status.err{color:var(--red)}
#preview-img{width:100%;border-radius:6px;margin-bottom:12px;max-height:180px;object-fit:contain;display:none}
.photo-btn{margin-top:12px;background:var(--surface2);color:#ccc;border:1px solid var(--border2);border-radius:6px;padding:10px 18px;font-size:11px;font-family:var(--font);cursor:pointer}
.run-btn{width:100%;background:#fff;color:#000;border:none;border-radius:6px;padding:16px;font-size:13px;font-family:var(--font);font-weight:700;letter-spacing:.12em;cursor:pointer;margin-top:4px}
.run-btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed}
.error-box{background:#1a0000;border:1px solid #3a0000;border-radius:6px;padding:12px;color:var(--red);font-size:12px;margin-bottom:12px;display:none}
.error-box.show{display:block}
#results{display:none}
.asset-meta{font-size:10px;color:var(--dim);letter-spacing:.1em;margin-bottom:10px}
.stage-banner{border-left:4px solid;border-radius:8px;padding:18px 16px;margin-bottom:12px}
.stage-label{font-size:26px;font-weight:900;letter-spacing:.06em;margin-bottom:8px}
.vdi-bar-track{background:#0d0d0d;border-radius:3px;height:5px;margin-bottom:10px}
.vdi-bar-fill{height:100%;border-radius:3px;transition:width .6s}
.stage-message{font-size:13px;color:#ccc;line-height:1.6}
.bearing-alert{background:#1a0800;border:1px solid rgba(255,122,0,.2);border-left:3px solid var(--orange);border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:12px;color:var(--orange);display:none}
.bearing-alert.show{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.card-title{font-size:10px;color:var(--muted);letter-spacing:.12em;margin-bottom:10px}
.action-text{font-size:13px;color:#ddd;line-height:1.7}
.next-check{font-size:11px;color:var(--muted);margin-top:10px}
.next-check span{color:#888}
.axis-row{margin-bottom:10px}
.axis-header{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.axis-name{color:#888}
.axis-val{color:#ccc}
.axis-bar-track{background:#0d0d0d;border-radius:3px;height:4px}
.axis-bar-fill{height:100%;border-radius:3px}
.axis-fault{font-size:9px;color:var(--dim);margin-top:2px}
.runway-days{display:flex;align-items:baseline;gap:8px}
.runway-num{font-size:42px;font-weight:700}
.runway-unit{font-size:13px;color:var(--muted)}
.runway-range{font-size:10px;color:var(--dim)}
.runway-narrative{font-size:11px;color:var(--muted);margin-top:5px}
.accel-warning{font-size:11px;color:var(--orange);margin-top:6px}
.cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.cost-cell{border-radius:6px;padding:12px}
.cost-cell.now{background:#091209;border:1px solid #0d2a0d}
.cost-cell.later{background:#120909;border:1px solid #2a0d0d}
.cost-cell-label{font-size:9px;color:var(--muted);margin-bottom:4px}
.cost-cell-value{font-size:22px;font-weight:700}
.cost-cell.now .cost-cell-value{color:var(--green)}
.cost-cell.later .cost-cell-value{color:var(--red)}
.cost-save{background:#091209;border:1px solid #0d2a0d;border-radius:6px;padding:10px;font-size:12px;color:var(--green);font-weight:700}
.cost-roi{font-size:10px;color:var(--dim);margin-top:8px;line-height:1.5}
.readings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reading-cell{background:#0d0d0d;border-radius:4px;padding:9px}
.reading-label{font-size:9px;color:#3a3a3a;margin-bottom:3px}
.reading-value{font-size:13px;color:#999}
.reset-btn{width:100%;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:13px;font-size:11px;font-family:var(--font);letter-spacing:.1em;cursor:pointer;margin-bottom:8px}
footer{padding:14px 20px;border-top:1px solid #111;font-size:9px;color:#222;text-align:center;letter-spacing:.1em}
.temp-hint{font-size:10px;margin-top:4px}
.temp-hint.warn{color:var(--orange)}
.temp-hint.crit{color:var(--red)}
</style>
</head>
<body>
<header>
<div><div class="logo">EARLYEDGE</div><div class="logo-sub">FIELD DIAGNOSTIC · v2.2</div></div>
<div class="live-badge">● LIVE</div>
</header>
<main>
<div id="form-section">
<div class="tabs">
<button class="tab active" onclick="switchTab('manual')">⌨ Enter Readings</button>
<button class="tab" onclick="switchTab('photo')">📷 Scan Photo</button>
</div>
<div class="photo-zone" id="photo-zone" style="display:none">
<img id="preview-img" alt="preview">
<div class="photo-icon" id="photo-icon">📷</div>
<div class="photo-status" id="photo-status">Photo of gauge, display, or readout</div>
<input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">
<button class="photo-btn" onclick="document.getElementById('photo-input').click()" id="photo-btn">Choose Photo</button>
</div>
<div class="field">
<label>Asset Type</label>
<select id="asset-select" onchange="assetChanged(this)">
<optgroup label="Pumps">
<option value="centrifugal_pump">Centrifugal Pump</option>
<option value="slurry_pump">Slurry Pump</option>
<option value="irrigation_pump">Irrigation Pump</option>
<option value="circulation_pump">Circulation Pump</option>
<option value="boiler_feed_pump">Boiler Feed Pump</option>
<option value="irrigation_pump">Nutrient Dosing Pump</option>
<option value="circulation_pump">Cooling Tower Pump</option>
<option value="slurry_pump">Submersible Pump</option>
<option value="slurry_pump">Hydraulic Pump</option>
</optgroup>
<optgroup label="Fans &amp; Air">
<option value="fan_motor">Fan Motor</option>
<option value="fan_motor">Exhaust Fan</option>
<option value="fan_motor">Ventilation Fan</option>
<option value="fan_motor">Cooling Tower Fan</option>
<option value="hvac_unit">Air Handler Unit</option>
<option value="hvac_unit">HVAC Unit</option>
<option value="general">Air Compressor</option>
<option value="general">Vacuum Pump</option>
</optgroup>
<optgroup label="Generation &amp; Power">
<option value="general">Diesel Generator</option>
<option value="general">Natural Gas Generator</option>
<option value="general">Standby Generator</option>
<option value="general">Transfer Switch Motor</option>
<option value="general">Alternator</option>
</optgroup>
<optgroup label="Heavy Equipment">
<option value="general">Excavator Swing Motor</option>
<option value="slurry_pump">Hydraulic Cylinder Pump</option>
<option value="general">Track Drive Motor</option>
<option value="slurry_pump">Boom Pump Motor</option>
<option value="general">Conveyor Drive Motor</option>
<option value="general">Crusher Motor</option>
<option value="general">Screener Vibrator Motor</option>
<option value="general">Winch Motor</option>
</optgroup>
<optgroup label="Industrial">
<option value="general">Gearbox</option>
<option value="co2_pump">CO2 Pump</option>
<option value="boiler_feed_pump">Boiler</option>
<option value="hvac_unit">Chiller</option>
<option value="circulation_pump">Cooling Pump</option>
<option value="general">Compressor</option>
<option value="general">Turbine</option>
<option value="general">Mixer / Agitator</option>
<option value="general" selected>General Equipment</option>
</optgroup>
</select>
</div>
<div class="field">
<label>Asset ID <span>(optional — enables trend tracking)</span></label>
<input type="text" id="asset-id" placeholder="e.g. gen-unit-01">
</div>
<div class="field">
<label>RMS Velocity (mm/s) <span>* required if no XYZ</span></label>
<input type="number" step="0.01" id="rms" placeholder="e.g. 4.2" class="big">
</div>
<div class="field">
<label>Bearing Temperature (°C) <span>(optional)</span></label>
<input type="number" step="0.1" id="bearing-temp" placeholder="e.g. 62" oninput="tempChanged(this)">
<div class="temp-hint" id="temp-hint"></div>
</div>
<div class="field">
<label>XYZ Vibration (mm/s) <span>(optional)</span></label>
<div class="grid3">
<div><div class="axis-label">Horizontal</div><input type="number" step="0.01" placeholder="H" class="axis-input" id="vib-h" oninput="updateVector()"></div>
<div><div class="axis-label">Vertical</div><input type="number" step="0.01" placeholder="V" class="axis-input" id="vib-v" oninput="updateVector()"></div>
<div><div class="axis-label">Axial</div><input type="number" step="0.01" placeholder="A" class="axis-input" id="vib-a" oninput="updateVector()"></div>
</div>
<div class="vector-rms" id="vector-rms"></div>
</div>
<button class="advanced-toggle" onclick="toggleAdvanced(this)">▼ Shaft &amp; Vane Data</button>
<div class="advanced-section" id="advanced-section">
<div class="grid2" style="margin-bottom:13px">
<div class="field" style="margin-bottom:0"><label>Shaft RPM</label><input type="number" id="shaft-rpm" placeholder="1750"></div>
<div class="field" style="margin-bottom:0"><label>Vane Count</label><input type="number" id="vane-count" placeholder="5"></div>
</div>
</div>
<div class="error-box" id="error-box"></div>
<button class="run-btn" id="run-btn" onclick="runDiagnostic()">RUN DIAGNOSTIC</button>
</div>
<div id="results">
<div class="asset-meta" id="result-meta"></div>
<div class="stage-banner" id="stage-banner">
<div class="stage-label" id="stage-label"></div>
<div class="vdi-bar-track"><div class="vdi-bar-fill" id="vdi-bar"></div></div>
<div class="stage-message" id="stage-message"></div>
</div>
<div class="bearing-alert" id="bearing-alert"></div>
<div class="card"><div class="card-title">WHAT TO DO</div><div class="action-text" id="action-text"></div><div class="next-check" id="next-check"></div></div>
<div class="card" id="xyz-card" style="display:none"><div class="card-title">VIBRATION AXES</div><div id="xyz-rows"></div></div>
<div class="card" id="runway-card" style="display:none"><div class="card-title">ESTIMATED RUNWAY</div><div class="runway-days"><span class="runway-num" id="runway-days"></span><span class="runway-unit">days</span><span class="runway-range" id="runway-range"></span></div><div class="runway-narrative" id="runway-narrative"></div><div class="accel-warning" id="accel-warning" style="display:none">⚠ Fault progression accelerating</div></div>
<div class="card" id="cost-card" style="display:none"><div class="card-title">COST IMPACT (CAD)</div><div class="cost-grid"><div class="cost-cell now"><div class="cost-cell-label">FIX NOW</div><div class="cost-cell-value" id="cost-now"></div></div><div class="cost-cell later"><div class="cost-cell-label">FIX LATER</div><div class="cost-cell-value" id="cost-later"></div></div></div><div class="cost-save" id="cost-save"></div><div class="cost-roi" id="cost-roi"></div></div>
<div class="card"><div class="card-title">RAW READINGS</div><div class="readings-grid" id="readings-grid"></div></div>
<button class="reset-btn" onclick="resetForm()">← NEW DIAGNOSTIC</button>
</div>
</main>
<footer>AW IP HOLDINGS INC. · EARLYEDGE FIELD PRO · PROPRIETARY</footer>
<script>
const API='https://earlyedge-api.onrender.com';
const STAGE={healthy:{color:'#00C48C',bg:'#001a12',icon:'✓'},watch:{color:'#F5C518',bg:'#1a1600',icon:'⚠'},warning:{color:'#FF7A00',bg:'#1a0c00',icon:'!'},critical:{color:'#FF3B3B',bg:'#1a0000',icon:'✕'}};
let currentAssetType='general',currentAssetLabel='General Equipment';
function switchTab(t){document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&t==='manual')||(i===1&&t==='photo')));document.getElementById('photo-zone').style.display=t==='photo'?'block':'none';}
function assetChanged(s){currentAssetType=s.value;currentAssetLabel=s.options[s.selectedIndex].text;}
function tempChanged(i){const v=parseFloat(i.value),h=document.getElementById('temp-hint');i.classList.remove('warn','crit');h.textContent='';if(!isNaN(v)){if(v>80){i.classList.add('crit');h.className='temp-hint crit';h.textContent='⚠ Critical temp threshold';}else if(v>65){i.classList.add('warn');h.className='temp-hint warn';h.textContent='⚠ Elevated — monitor closely';}}}
function updateVector(){const h=parseFloat(document.getElementById('vib-h').value)||0,v=parseFloat(document.getElementById('vib-v').value)||0,a=parseFloat(document.getElementById('vib-a').value)||0,el=document.getElementById('vector-rms');if(h||v||a){el.textContent='Vector RMS: '+Math.sqrt(h*h+v*v+a*a).toFixed(3)+' mm/s';}else{el.textContent='';}}
function toggleAdvanced(b){const s=document.getElementById('advanced-section');s.classList.toggle('open');b.textContent=s.classList.contains('open')?'▲ Shaft & Vane Data':'▼ Shaft & Vane Data';}
function getEffectiveRms(){const h=parseFloat(document.getElementById('vib-h').value)||0,v=parseFloat(document.getElementById('vib-v').value)||0,a=parseFloat(document.getElementById('vib-a').value)||0;if(h||v||a)return Math.sqrt(h*h+v*v+a*a);return parseFloat(document.getElementById('rms').value)||null;}
function showError(m){const e=document.getElementById('error-box');e.textContent=m;e.classList.add('show');}
function clearError(){document.getElementById('error-box').classList.remove('show');}
async function runDiagnostic(){clearError();const rms=getEffectiveRms();if(!rms){showError('Enter RMS velocity or at least one XYZ axis reading.');return;}const btn=document.getElementById('run-btn');btn.disabled=true;btn.textContent='ANALYZING...';const body={asset_type:currentAssetType,mode:'field',rms_velocity:rms};const aid=document.getElementById('asset-id').value.trim();if(aid)body.asset_id=aid;const rpm=parseFloat(document.getElementById('shaft-rpm').value);if(rpm)body.shaft_rpm=rpm;const vanes=parseInt(document.getElementById('vane-count').value);if(vanes)body.vane_count=vanes;try{const res=await fetch(API+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok){const e=await res.json();throw new Error(e.detail||'API error');}const data=await res.json();renderResults(data,{bearingTemp:parseFloat(document.getElementById('bearing-temp').value)||null,vibH:parseFloat(document.getElementById('vib-h').value)||null,vibV:parseFloat(document.getElementById('vib-v').value)||null,vibA:parseFloat(document.getElementById('vib-a').value)||null,effectiveRms:rms,assetLabel:currentAssetLabel,assetId:aid});}catch(e){showError(e.message);btn.disabled=false;btn.textContent='RUN DIAGNOSTIC';}}
function renderResults(data,extra){document.getElementById('form-section').style.display='none';document.getElementById('results').style.display='block';const s=STAGE[data.stage];document.getElementById('result-meta').textContent=extra.assetLabel.toUpperCase()+(extra.assetId?' · '+extra.assetId:'');const banner=document.getElementById('stage-banner');banner.style.background=s.bg;banner.style.borderLeftColor=s.color;document.getElementById('stage-label').style.color=s.color;document.getElementById('stage-label').textContent=s.icon+' '+data.stage.toUpperCase();document.getElementById('vdi-bar').style.width=data.vdi_score+'%';document.getElementById('vdi-bar').style.background='linear-gradient(90deg,#00C48C,'+s.color+')';document.getElementById('stage-message').textContent=data.message;const ba=document.getElementById('bearing-alert');if(extra.bearingTemp&&extra.bearingTemp>65){ba.textContent='🌡 Bearing temp '+extra.bearingTemp+'°C '+(extra.bearingTemp>80?'— CRITICAL: inspect immediately.':'— elevated, monitor closely.');ba.classList.add('show');}document.getElementById('action-text').textContent=data.recommended_action;const hrs=data.next_check_interval_hours;document.getElementById('next-check').innerHTML='Next check: <span>'+(hrs>=24?(hrs/24)+' day(s)':hrs+' hr(s)')+'</span>';const axes=[['Horizontal',extra.vibH,'Imbalance / Looseness'],['Vertical',extra.vibV,'Looseness / Resonance'],['Axial',extra.vibA,'Misalignment / Thrust']].filter(([,v])=>v!==null);if(axes.length){document.getElementById('xyz-card').style.display='block';document.getElementById('xyz-rows').innerHTML=axes.map(([n,v,f])=>`<div class="axis-row"><div class="axis-header"><span class="axis-name">${n}</span><span class="axis-val">${v} mm/s</span></div><div class="axis-bar-track"><div class="axis-bar-fill" style="width:${Math.min(100,(v/20)*100)}%;background:${s.color}"></div></div><div class="axis-fault">Fault indicator: ${f}</div></div>`).join('');}const dtf=data.days_to_failure;if(dtf&&dtf.status!=='insufficient_data'&&dtf.days_estimate){document.getElementById('runway-card').style.display='block';document.getElementById('runway-days').style.color=s.color;document.getElementById('runway-days').textContent=Math.round(dtf.days_estimate);if(dtf.days_lower&&dtf.days_upper)document.getElementById('runway-range').textContent='('+Math.round(dtf.days_lower)+'–'+Math.round(dtf.days_upper)+')';document.getElementById('runway-narrative').textContent=dtf.confidence_narrative||'';if(dtf.acceleration_detected)document.getElementById('accel-warning').style.display='block';}const cost=data.cost_impact;if(cost&&cost.fix_now_cost>0){document.getElementById('cost-card').style.display='block';document.getElementById('cost-now').textContent='$'+cost.fix_now_cost.toLocaleString();document.getElementById('cost-later').textContent='$'+cost.fix_later_cost.toLocaleString();document.getElementById('cost-save').textContent='Save $'+cost.estimated_savings.toLocaleString()+' ('+cost.savings_pct+'%) by acting now';document.getElementById('cost-roi').textContent=cost.roi_window;}const readings=[['VDI Score',data.vdi_score+' / 100'],['Crest Factor',data.crest_factor],['PCI',data.pci],['Entropy',data.spectral_entropy],['Confidence',Math.round(data.confidence*100)+'%'],['Eff. RMS',extra.effectiveRms.toFixed(3)+' mm/s']];if(extra.bearingTemp)readings.push(['Bearing Temp',extra.bearingTemp+'°C']);document.getElementById('readings-grid').innerHTML=readings.map(([l,v])=>`<div class="reading-cell"><div class="reading-label">${l}</div><div class="reading-value">${v}</div></div>`).join('');}
function resetForm(){document.getElementById('form-section').style.display='block';document.getElementById('results').style.display='none';document.getElementById('run-btn').disabled=false;document.getElementById('run-btn').textContent='RUN DIAGNOSTIC';document.getElementById('bearing-alert').classList.remove('show');['xyz-card','runway-card','cost-card'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById('accel-warning').style.display='none';document.getElementById('temp-hint').textContent='';document.getElementById('vector-rms').textContent='';switchTab('manual');}
async function handlePhoto(input){const file=input.files[0];if(!file)return;const preview=document.getElementById('preview-img'),icon=document.getElementById('photo-icon'),status=document.getElementById('photo-status'),btn=document.getElementById('photo-btn');preview.src=URL.createObjectURL(file);preview.style.display='block';icon.style.display='none';status.className='photo-status';status.textContent='Reading gauge...';btn.textContent='Reading...';try{const b64=await toBase64(file),extracted=await extractFromImage(b64,file.type);if(extracted){if(extracted.rms_velocity)document.getElementById('rms').value=extracted.rms_velocity;if(extracted.shaft_rpm)document.getElementById('shaft-rpm').value=extracted.shaft_rpm;if(extracted.bearing_temp_c){document.getElementById('bearing-temp').value=extracted.bearing_temp_c;tempChanged(document.getElementById('bearing-temp'));}if(extracted.vib_horizontal)document.getElementById('vib-h').value=extracted.vib_horizontal;if(extracted.vib_vertical)document.getElementById('vib-v').value=extracted.vib_vertical;if(extracted.vib_axial)document.getElementById('vib-a').value=extracted.vib_axial;updateVector();status.className='photo-status ok';status.textContent='✓ Readings extracted'+(extracted.asset_description?' — '+extracted.asset_description:'');switchTab('manual');}else{status.className='photo-status err';status.textContent='Could not read numbers — enter manually';}}catch(e){status.className='photo-status err';status.textContent='Image read failed — enter manually';}btn.textContent='Choose Different';}
function toBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(new Error('Read failed'));r.readAsDataURL(file);});}
async function extractFromImage(b64,mediaType){const response=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mediaType,data:b64}},{type:'text',text:'Extract mechanical equipment readings. Return ONLY valid JSON: {"rms_velocity":null,"shaft_rpm":null,"bearing_temp_c":null,"vib_horizontal":null,"vib_vertical":null,"vib_axial":null,"asset_description":"","notes":""}'}]}]})});const data=await response.json();const text=data.content?.find(b=>b.type==='text')?.text||'{}';try{return JSON.parse(text.replace(/```json|```/g,'').trim());}catch{return null;}}
</script>
